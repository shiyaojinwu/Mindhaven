<text x="56.0" y="1125.0" text-anchor="start" fill="#243247" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400">数据边界  SQLite 保存长期业务事实；Redis 保存近期展示事件。最终消息、任务终态与 Outbox 同事务提交。</text>
<text x="56.0" y="1145.0" text-anchor="start" fill="#243247" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400">事件来源  Agent 回调经会话与任务服务交给 Publisher；Outbox 从 SQLite 读取待发布通知。图中省略跨层细线，避免交叉。</text>
<text x="56.0" y="1165.0" text-anchor="start" fill="#243247" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400">部署边界  02–04 层及事件服务运行在同一后端进程；Worker 是线程池，不是独立微服务。</text>
