server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  servlet:
    multipart:
      max-file-size: ${VIDEO_MAX_SIZE:512MB}
      max-request-size: ${VIDEO_REQUEST_MAX_SIZE:520MB}
      file-size-threshold: 0B
  datasource:
    url: ${DB_URL:jdbc:sqlite:mindhaven.db}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
mindhaven:
  tracing:
    sample-rate: ${TRACE_SAMPLE_RATE:1.0}
    otlp-endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
  retrieval:
    mode: ${RAG_RETRIEVAL_MODE:hybrid}
    candidate-limit: ${RAG_CANDIDATE_LIMIT:20}
    rrf-k: ${RAG_RRF_K:60}
    vector-threshold: ${RAG_VECTOR_THRESHOLD:0.35}
  runtime:
    deadline-seconds: ${AI_RUN_DEADLINE_SECONDS:180}
    token-budget: ${AI_RUN_TOKEN_BUDGET:24000}
  media-storage: ${MEDIA_STORAGE:local}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
  media-dir: ${MEDIA_DIR:./media}
  video-max-size: ${VIDEO_MAX_SIZE:512MB}
  ai-mode: ${AI_MODE:demo}
  vector-mode: ${VECTOR_MODE:local}
  chat-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  chat-path: ${DEEPSEEK_CHAT_PATH:/chat/completions}
  chat-model: ${DEEPSEEK_MODEL:deepseek-chat}
  chat-key: ${DEEPSEEK_API_KEY:}
  embedding-base-url: ${EMBEDDING_BASE_URL:http://localhost:11434}
  embedding-path: ${EMBEDDING_PATH:/v1/embeddings}
  embedding-revision: ${EMBEDDING_REVISION:v1}
  embedding-model: ${EMBEDDING_MODEL:embeddinggemma}
  embedding-key: ${EMBEDDING_API_KEY:local}
  qdrant-host: ${QDRANT_HOST:localhost}
  qdrant-port: ${QDRANT_PORT:6334}
  qdrant-collection: ${QDRANT_COLLECTION:mindhaven_embeddinggemma_v1}
  # Configure the effective context window supported by your model/gateway.
  context-budget: ${MODEL_CONTEXT_WINDOW:12000}
  context:
    compression-enabled: ${CONTEXT_COMPRESSION_ENABLED:true}
    compression-threshold: ${CONTEXT_COMPRESSION_THRESHOLD:0.8}
    keep-recent-turns: ${CONTEXT_KEEP_RECENT_TURNS:3}
    max-compression-passes: ${CONTEXT_MAX_COMPRESSION_PASSES:4}
    max-input-characters: ${CHAT_MAX_INPUT_CHARACTERS:1500}
  output-budget: 1400
  knowledge-budget: 3600
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} spanId=%X{spanId:-}]"
  level:
    root: INFO
